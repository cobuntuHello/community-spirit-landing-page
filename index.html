<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Spirit — Join the Community</title>
  <meta name="description" content="A curated community built on shared values, real connection, and collective growth.">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Raleway:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Raleway', system-ui, sans-serif; color: #F5EDE0;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 24px; position: relative; overflow: hidden;
      background: #2A2318;
    }
    a { text-decoration: none; color: inherit; }
    ::selection { background: rgba(255,255,255,0.2); }

    /* Grain overlay — leather texture feel */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      opacity: 0.4; mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='5' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* Warm radial glow */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,0.04) 0%, transparent 65%);
    }


    /* Content */
    .page {
      max-width: 560px; width: 100%; text-align: center; position: relative; z-index: 1;
      animation: fadeSlideIn 0.8s ease-out both;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: clamp(220px, 35vw, 300px); height: auto;
      margin: 0 auto 32px; display: block;
      opacity: 0; transition: opacity 0.6s ease;
    }
    .logo.loaded { opacity: 1; }

    h1 {
      font-family: 'Poiret One', serif;
      font-size: clamp(44px, 10vw, 80px);
      font-weight: 400; color: #FFFFFF;
      margin: 0 0 28px; line-height: 0.95;
      letter-spacing: 0.06em; text-transform: uppercase;
    }

    .tagline {
      font-size: clamp(15px, 2.5vw, 18px); font-weight: 200;
      color: rgba(245,237,224,0.5); line-height: 1.8;
      margin: 0 0 36px; max-width: 420px; margin-left: auto; margin-right: auto;
      letter-spacing: 0.02em;
    }

    .line { width: 1px; height: 40px; background: rgba(255,255,255,0.12); margin: 0 auto 32px; }

    .founder { font-size: 14px; color: rgba(245,237,224,0.35); margin: 0 0 48px; font-weight: 300; line-height: 1.7; }
    .founder strong { color: rgba(255,255,255,0.7); font-weight: 400; letter-spacing: 0.04em; }
    .founder .role { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 2.5px; margin-top: 4px; color: rgba(255,255,255,0.25); }

    /* Form */
    .form-wrapper {
      display: flex; gap: 0; max-width: 420px; margin: 0 auto;
      border-radius: 4px; overflow: hidden;
    }
    .form-wrapper input {
      flex: 1; min-width: 0; padding: 16px 20px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
      border-right: none; border-radius: 4px 0 0 4px;
      color: #F5EDE0; font-size: 14px; font-weight: 300;
      font-family: inherit; letter-spacing: 0.02em;
      outline: none; transition: border-color 0.3s;
    }
    .form-wrapper input::placeholder { color: rgba(245,237,224,0.25); }
    .form-wrapper input:focus { border-color: rgba(255,255,255,0.35); }
    .form-wrapper button {
      padding: 16px 32px;
      background: #F5EDE0; border: none; border-radius: 0 4px 4px 0;
      color: #2A2318; font-size: 11px; font-weight: 500;
      font-family: inherit; letter-spacing: 2.5px; text-transform: uppercase;
      cursor: pointer; transition: all 0.3s; white-space: nowrap;
    }
    .form-wrapper button:hover { background: #FFFFFF; transform: translateY(-1px); }
    .form-wrapper button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .note {
      font-size: 12px; color: rgba(245,237,224,0.2);
      margin-top: 24px; letter-spacing: 0.5px; font-weight: 200;
    }

    /* States */
    .form-message {
      font-size: 14px; font-weight: 300; margin-top: 16px;
      letter-spacing: 0.02em; line-height: 1.6;
    }
    .form-message.success { color: rgba(255,255,255,0.8); }
    .form-message.error { color: rgba(255,150,150,0.7); }

    /* Spinner */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(42,35,24,0.2); border-top-color: #2A2318;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .footer {
      position: fixed; bottom: 20px; z-index: 1;
      font-size: 11px; color: rgba(245,237,224,0.35);
      letter-spacing: 0.5px; font-weight: 300;
      display: flex; gap: 20px; align-items: center;
    }
    .footer a { color: rgba(245,237,224,0.35); transition: color 0.2s; }
    .footer a:hover { color: rgba(255,255,255,0.6); }

    @media (max-width: 768px) {
      .s1 { font-size: 120px; top: 3%; left: 0; }
      .s2 { font-size: 70px; }
      .s4 { font-size: 100px; bottom: 4%; }
      .s5, .s6 { display: none; }
      .form-wrapper { flex-direction: column; }
      .form-wrapper input { border-right: 1px solid rgba(255,255,255,0.12); border-bottom: none; border-radius: 4px 4px 0 0; }
      .form-wrapper button { border-radius: 0 0 4px 4px; padding: 18px 32px; }
    }
  </style>
</head>
<body>

  <div class="page">
    <img id="community-logo" class="logo loaded" src="community-spirit-logo.png" alt="Community Spirit" />
    <h1>Community<br>Spirit</h1>
    <p class="tagline">A curated community built on shared values, real connection, and collective growth &mdash; for those who believe in the power of showing up together.</p>
    <p class="founder">
      by <strong>Truth W. Hawk</strong> &amp; <strong>Laurine Maria Komduur</strong>
    </p>

    <form class="form-wrapper" id="join-form" onsubmit="return handleSubmit(event)">
      <input type="email" id="email-input" placeholder="Your email address" required autocomplete="email" />
      <button type="submit" id="submit-btn">Join</button>
    </form>
    <div id="form-message" class="form-message" style="display:none"></div>
  </div>

  <div class="footer">
    <span>&copy; 2026 Community Spirit</span>
    <a href="https://cobuntu.com" target="_blank" rel="noopener noreferrer">Powered by Cobuntu</a>
  </div>

  <script>
    const API_URL = "https://api.cobuntu.com";
    const COMMUNITY_TAG = "community-spirit";
    const SEGMENT_ID = "seg-default-0b4b32b6-fcc5-4c86-9bfa-76871ffe9918";
    const API_KEY = "ck_a55d224494bcdcb6e5fc4eb611156a4fe899368d4e2065d936c4881aea30c799";

    let formSchema = null;

    // Fetch form schema on load to get the email field ID
    async function loadForm() {
      try {
        const res = await fetch(
          `${API_URL}/api/communities/${COMMUNITY_TAG}/segments/${SEGMENT_ID}/form`,
          { headers: { "X-API-Key": API_KEY } }
        );
        if (!res.ok) throw new Error("Failed to load form");
        formSchema = await res.json();
      } catch (e) {
        console.error("Could not load form schema:", e);
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const input = document.getElementById("email-input");
      const btn = document.getElementById("submit-btn");
      const msg = document.getElementById("form-message");
      const email = input.value.trim();

      if (!email) return false;

      // Disable while submitting
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      msg.style.display = "none";

      try {
        // Build answers — use the field ID from the schema, fallback to "email"
        const emailFieldId = formSchema?.fields?.[0]?.id || "email";
        const answers = { [emailFieldId]: email };

        const res = await fetch(
          `${API_URL}/api/communities/${COMMUNITY_TAG}/segments/${SEGMENT_ID}/submit`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-API-Key": API_KEY,
            },
            body: JSON.stringify({ answers, source: "landing_page" }),
          }
        );

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.error || "Something went wrong. Please try again.");
        }

        // Success
        input.style.display = "none";
        btn.style.display = "none";
        msg.className = "form-message success";
        msg.textContent = "You're in. Check your inbox for a confirmation email.";
        msg.style.display = "block";
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Join";
        msg.className = "form-message error";
        msg.textContent = err.message;
        msg.style.display = "block";
      }

      return false;
    }

    // Load form schema on page load
    loadForm();
  </script>

</body>
</html>
